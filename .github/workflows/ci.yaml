---
name: CI

"on":
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-dev.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write  # Required for OIDC authentication to npm

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create temp directory for tests
        run: mkdir -p .tmp

      - name: Install Python dependencies
        working-directory: docker
        run: uv sync --all-extras

      - name: Run Python tests
        working-directory: docker
        run: uv run pytest -v -m "not local"

      - name: Run Node.js tests
        run: npm run test:ci

      - name: Upload TypeScript coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: typescript
          name: typescript-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build package
        run: npm run build

  autotag:
    name: Auto-tag version bump
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      outcome: ${{ steps.release.outputs.outcome }}
      release_required: ${{ steps.release.outputs.release_required }}
      verified: ${{ steps.release.outputs.verified }}
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: docker
        run: uv sync --all-extras --frozen

      - name: Select, verify, and create automatic release tag
        id: release
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run version:tag:auto

  publish:
    name: Publish verified release transaction
    runs-on: ubuntu-latest
    needs: [test, autotag]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (
        needs.autotag.result == 'success' ||
        needs.autotag.result == 'skipped'
      ) &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (
          needs.autotag.outputs.release_required == 'true' &&
          needs.autotag.outputs.verified == 'true' &&
          needs.autotag.outputs.tag != ''
        )
      )
    concurrency:
      group: production-release-publication
      cancel-in-progress: false
    env:
      ECR_REGISTRY: 712023778557.dkr.ecr.us-east-1.amazonaws.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: docker
        run: uv sync --all-extras --frozen

      - name: Validate release tag and commit
        id: context
        env:
          RELEASE_TAG: >-
            ${{
              startsWith(github.ref, 'refs/tags/') &&
              github.ref_name ||
              needs.autotag.outputs.tag
            }}
        run: npm run release:context

      - name: Configure AWS credentials
        if: ${{ !cancelled() && success() }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        if: ${{ !cancelled() && success() }}
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Ensure centralized ECR repository exists
        if: ${{ !cancelled() && success() }}
        run: |
          if ! aws ecr describe-repositories \
            --repository-names quiltdata/benchling \
            --region us-east-1 >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name quiltdata/benchling \
              --region us-east-1
          fi

      - name: Build and push immutable Docker image
        if: ${{ !cancelled() && success() }}
        working-directory: docker
        run: >-
          make push-ci-immutable
          VERSION=${{ steps.context.outputs.version }}
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          AWS_REGION: us-east-1

      - name: Promote Docker latest monotonically
        if: ${{ !cancelled() && success() }}
        working-directory: docker
        run: >-
          make promote-ci
          VERSION=${{ steps.context.outputs.version }}
        env:
          AWS_REGION: us-east-1

      - name: Generate release notes
        if: ${{ !cancelled() && success() }}
        env:
          VERSION: ${{ steps.context.outputs.version }}
          IS_PRERELEASE: ${{ steps.context.outputs.is_prerelease }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/quiltdata/benchling:$VERSION"
          npm run deploy:notes -- \
            "$VERSION" \
            "$IMAGE_URI" \
            "$IS_PRERELEASE" \
            "@quiltdata/benchling-webhook" \
            > /tmp/release_notes.md

      - name: Create or update GitHub Release
        if: ${{ !cancelled() && success() }}
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.context.outputs.tag }}
          tag_name: ${{ steps.context.outputs.tag }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ steps.context.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            docker/app-manifest.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package version for prerelease artifact
        if: >-
          ${{ !cancelled() && success() &&
          steps.context.outputs.is_prerelease == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.context.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(
              "package.json",
              JSON.stringify(pkg, null, 2) + "\n",
            );
          '

      - name: Publish immutable npm version and promote channel monotonically
        if: ${{ !cancelled() && success() }}
        env:
          RELEASE_VERSION: ${{ steps.context.outputs.version }}
        run: npm run release:publish

      - name: Summarize release
        if: ${{ !cancelled() && success() }}
        env:
          TAG: ${{ steps.context.outputs.tag }}
          VERSION: ${{ steps.context.outputs.version }}
          IS_PRERELEASE: ${{ steps.context.outputs.is_prerelease }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/quiltdata/benchling:$VERSION"
          NPM_URL="https://www.npmjs.com/package/@quiltdata/benchling-webhook"
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Prerelease:** $IS_PRERELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "**Docker:** $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "**NPM:** $NPM_URL" >> "$GITHUB_STEP_SUMMARY"
