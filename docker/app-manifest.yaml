manifestVersion: 1
info:
  name: nightly-quilttest-com
  description: Packaging Benchling Notebooks as Quilt packages
  version: 0.19.0
features:
  - name: Quilt Connector
    id: quilt_entry
    type: CANVAS
subscriptions:
  deliveryMethod: WEBHOOK
  # `app` events  go to /lifecycle
  # `canvas` events go to /canvas (including interaction?)
  # All other events go to /event
  messages:
    - type: v2.canvas.userInteracted
    - type: v2.canvas.created # user clicks 'Create'
    - type: v2.entry.created # new notebook created
    - type: v2.entry.updated.fields
    - type: v2.entry.updated.reviewRecord
#  - type: v2.entity.registered

#  App Configuration lifecycle event: when the operator toggles a ["quilt"]
#  App Config Item in the Benchling UI, the config cache is invalidated
#  immediately so the new value is picked up on the next webhook event.
    - type: v2-beta.app.configuration.updated
